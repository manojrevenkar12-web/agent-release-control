[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-release-control"
version = "0.1.0"
description = "Release control for an AI customer-service agent: releases, simulations with known outcomes, calibrated judges, backtests, A/B tests, staged rollouts, SLOs and cost, and a measurement of how often the shipping process itself gets it wrong."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs simulations (a few seconds to a minute)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
files = ["src/arc"]
ignore_missing_imports = true
check_untyped_defs = false
