# What customers really want, and how they say it. Simulator only: the agent never reads this file.
#
# kind: answer (a help-centre article resolves it; plan_specific: the right plan section matters),
#       procedure (an action in our systems resolves it), handoff (a team must take it), decline
#       (no answer exists; the right response says so and offers a person).
# a: phrasings seen in the past (and in training data); b: phrasings that only appear live.

areas:
  billing: ["I have a billing question", "question about my bill", "something is wrong with billing", "need help with payments"]
  account: ["I need help with my account", "account problem", "help with my login stuff"]
  product: ["how does this work", "I have a question about a feature", "quick question about the app"]

intents:
